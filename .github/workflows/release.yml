name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to create (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git and Tagging
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Create and force-push the specified tag if run manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag -f "${{ env.TAG_NAME }}"
            git push -f origin "${{ env.TAG_NAME }}"
          fi
          # Keep 'latest' tag updating on every release
          git tag -f "latest"
          git push -f origin "latest"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "CLOUDFLARE_R2_ACCOUNT_ID=${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}" >> .env
          echo "CLOUDFLARE_R2_BUCKET_NAME=${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}" >> .env
          echo "CLOUDFLARE_R2_ACCESS_KEY_ID=${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}" >> .env
          echo "CLOUDFLARE_R2_SECRET_ACCESS_KEY=${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}" >> .env
          echo "CLOUDFLARE_R2_PUBLIC_URL_PREFIX=${{ secrets.CLOUDFLARE_R2_PUBLIC_URL_PREFIX }}" >> .env
          echo "ZOOZ_SHARE_URL=${{ secrets.ZOOZ_SHARE_URL }}" >> .env

      - name: Create google-services.json
        shell: bash
        run: |
          cat <<EOF > app/google-services.json
          ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          EOF

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Keystore decoded successfully since RELEASE_KEYSTORE_BASE64 was provided."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret provided. Decoding debug keystore as fallback."
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Decoded debug keystore as a release fallback."
            else
              echo "Error: debug.keystore.base64 not found in the root directory!"
            fi
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
